<!doctype html>
<html>
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>{{emailStyles}}</style></head>
  <body>
    <div class="wrap">
      <div class="card">
        <div class="brand">hook<span class="brand-dot">.</span></div>
        <div class="icon">▣</div>
        <h1>{{title}}</h1>
        <p class="lead">{{intro}}</p>
        <div class="code">{{code}}</div>
        <p class="meta">This code will expire in <strong>{{expiresIn}}</strong></p>
        <div class="notice">For your security, do not share this code with anyone. Hook will never ask for your password or OTP.</div>
      </div>
      <p class="footer">The OTP is valid for {{expiresIn}}. Please do not share OTP with anyone.</p>
    </div>
  </body>
</html>
