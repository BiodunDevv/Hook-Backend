name: hook

x-app: &app
  image: hook-api:latest
  env_file: .env
  environment:
    NODE_ENV: production
    PORT: "4000"
    WORKER_IN_PROCESS: "false"
    REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
  restart: unless-stopped
  depends_on:
    redis:
      condition: service_healthy
  volumes:
    - uploads:/app/uploads
  networks: [backend]
  deploy:
    resources:
      limits: { cpus: "1.0", memory: 768M }

services:
  api-1:
    <<: *app
    build:
      context: ..
  api-2: *app
  api-3: *app

  worker:
    <<: *app
    command: ["node", "dist/worker.js"]
    healthcheck:
      disable: true
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes",
              "--maxmemory", "400mb", "--maxmemory-policy", "noeviction"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks: [backend]
    deploy:
      resources:
        limits: { memory: 512M }

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/hook.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api-1, api-2, api-3]
    restart: unless-stopped
    networks: [backend]
    deploy:
      resources:
        limits: { memory: 128M }

volumes:
  uploads:
  redis-data:

networks:
  backend:
