<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>{{emailStyles}}</style></head><body><div class="wrap"><div class="card"><div class="brand">hook<span class="brand-dot">.</span></div><div class="icon">NEW</div><h1>New order for {{vendorName}}</h1><p class="lead">A customer just placed an order that includes your catalog item. Please prepare your fulfillment workflow.</p><div class="panel"><div class="row"><span class="label">Order ID</span><span class="value">{{orderCode}}</span></div><div class="row"><span class="label">Customer</span><span class="value">{{customerName}}</span></div><div class="row"><span class="label">Vendor items</span><span class="value">{{itemCount}}</span></div><div class="row"><span class="label">Vendor total</span><span class="value">{{amount}}</span></div></div><p style="text-align:center"><a class="button" href="{{dashboardUrl}}">View order</a></p></div><p class="footer">Hook vendor operations.</p></div></body></html>
