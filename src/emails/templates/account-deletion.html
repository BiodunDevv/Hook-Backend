<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      {{emailStyles}}
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <div class="banner">
          <div class="brand">hook<span class="brand-dot">.</span></div>
          <p class="greeting">Hello {{name}}</p>
          <h1>{{title}}</h1>
        </div>
        <div class="body">
          <p class="lead">{{intro}}</p>
          {{{codeBlock}}}
          <p class="lead">{{detail}}</p>
          {{{button}}}
          <p class="lead" style="font-size: 12px; color: #71717a">{{safety}}</p>
        </div>
      </div>
      <p class="footer">
        <span class="footer-brand">hook<span>.</span></span
        ><br />Need help? Contact {{supportEmail}}
      </p>
    </div>
  </body>
</html>
