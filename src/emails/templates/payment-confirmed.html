<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>{{emailStyles}}</style></head><body><div class="wrap"><div class="card"><div class="brand">hook<span class="brand-dot">.</span></div><div class="icon">✓</div><h1>Payment confirmed</h1><p class="lead">Hi {{name}}, we've confirmed payment for order {{orderCode}}. Your order is now moving into fulfilment.</p><div class="panel"><div class="row"><span class="label">Order ID</span><span class="value">{{orderCode}}</span></div><div class="row"><span class="label">Amount paid</span><span class="value">{{amount}}</span></div></div><p style="text-align:center"><a class="button" href="{{appUrl}}">Track your order</a></p></div><p class="footer">Thanks for shopping with Hook.</p></div></body></html>
