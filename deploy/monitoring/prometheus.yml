global:
  scrape_interval: 30s

scrape_configs:
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
  - job_name: rabbitmq
    metrics_path: /metrics/detailed
    params:
      family: [queue_consumer_count, queue_coarse_metrics]
    static_configs:
      - targets: ["rabbitmq:15692"]
  - job_name: rabbitmq-global
    static_configs:
      - targets: ["rabbitmq:15692"]
  - job_name: api
    static_configs:
      - targets: ["api-1:4000", "api-2:4000", "api-3:4000"]
