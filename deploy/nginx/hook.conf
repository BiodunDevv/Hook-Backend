set_real_ip_from 173.245.48.0/20;  set_real_ip_from 103.21.244.0/22;  set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;    set_real_ip_from 141.101.64.0/18;  set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;  set_real_ip_from 188.114.96.0/20;  set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;  set_real_ip_from 162.158.0.0/15;   set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;    set_real_ip_from 172.64.0.0/13;    set_real_ip_from 131.0.72.0/22;
real_ip_header CF-Connecting-IP;

resolver 127.0.0.11 valid=10s ipv6=off;

limit_req_zone  $binary_remote_addr zone=auth:10m rate=5r/s;
limit_req_zone  $binary_remote_addr zone=api:20m  rate=30r/s;
limit_conn_zone $binary_remote_addr zone=perip:10m;

upstream api_pool {
  zone api_pool 64k;
  least_conn;
  server api-1:4000 resolve max_fails=3 fail_timeout=10s;
  server api-2:4000 resolve max_fails=3 fail_timeout=10s;
  server api-3:4000 resolve max_fails=3 fail_timeout=10s;
  keepalive 64;
}

upstream socket_pool {
  zone socket_pool 64k;
  hash $remote_addr consistent;
  server api-1:4000 resolve;
  server api-2:4000 resolve;
  server api-3:4000 resolve;
}

server {
  listen 80 default_server;
  server_name _;

  client_max_body_size 85m;
  limit_conn perip 20;
  gzip on;
  gzip_types application/json text/plain text/css application/javascript;

  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Request-ID $request_id;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  proxy_read_timeout 60s;
  server_tokens off;

  location = /health { access_log off; proxy_pass http://api_pool; }

  location /api/v1/auth/ {
    limit_req zone=auth burst=10 nodelay;
    limit_req_status 429;
    proxy_pass http://api_pool;
  }

  location ~ ^/api/v1/(webhooks|payments)/ {
    proxy_pass http://api_pool;
  }

  location /socket.io/ {
    proxy_pass http://socket_pool;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 75s;
  }

  location / {
    limit_req zone=api burst=60 nodelay;
    limit_req_status 429;
    proxy_next_upstream error timeout http_502 http_503;
    proxy_pass http://api_pool;
  }
}
