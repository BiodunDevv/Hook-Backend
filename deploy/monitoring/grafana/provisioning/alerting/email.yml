apiVersion: 1

contactPoints:
  - orgId: 1
    name: email
    receivers:
      - uid: email
        type: webhook
        settings:
          url: http://alert-mailer:8080/
          httpMethod: POST

policies:
  - orgId: 1
    receiver: email
    group_by: ["alertname"]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
