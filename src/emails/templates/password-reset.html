<!doctype html>
<html>
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>{{emailStyles}}</style></head>
  <body>
    <div class="wrap">
      <div class="card">
        <div class="brand">hook<span class="brand-dot">.</span></div>
        <div class="icon">KEY</div>
        <h1>Reset your admin password</h1>
        <p class="lead">Hi {{name}}, use this one time password to reset your Hook admin password.</p>
        <div class="code">{{code}}</div>
        <p class="meta">This code will expire in <strong>{{expiresIn}}</strong></p>
        <div class="notice">If you did not request this, ignore this email and contact {{supportEmail}}.</div>
      </div>
      <p class="footer">Hook admin security notification.</p>
    </div>
  </body>
</html>
