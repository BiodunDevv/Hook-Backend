<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>{{emailStyles}}</style></head><body><div class="wrap"><div class="card"><div class="banner"><div class="brand">hook<span class="brand-dot">.</span></div><p class="greeting">Hello {{name}}</p><h1>Your price is locked in</h1></div><div class="body"><p class="lead">Your negotiated price for {{productTitle}} is confirmed. Checkout before your quote expires.</p><div class="panel"><div class="row"><span class="label">Product</span><span class="value">{{productTitle}}</span></div><div class="row"><span class="label">Agreed price</span><span class="value">{{agreedPrice}}</span></div><div class="row row-total"><span class="label">Quote expires</span><span class="value">{{quoteExpiresAt}}</span></div></div><p style="text-align:center"><a class="button" href="{{appUrl}}">Checkout now</a></p></div></div><p class="footer"><span class="footer-brand">hook<span>.</span></span><br>Need help? Contact {{supportEmail}}</p></div></body></html>
