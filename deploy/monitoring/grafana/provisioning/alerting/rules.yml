apiVersion: 1

groups:
  - orgId: 1
    name: hook
    folder: Hook
    interval: 1m
    rules:
      - uid: hook-disk
        title: Disk almost full
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: The server disk is over 80% full.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 1 - node_filesystem_avail_bytes{mountpoint="/",fstype!="rootfs"} / node_filesystem_size_bytes{mountpoint="/",fstype!="rootfs"}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.8] }

      - uid: hook-memory
        title: Memory running low
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: Less than 15% of the server's memory is free.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [0.15] }

      - uid: hook-consumers
        title: Event consumer down
        condition: C
        for: 3m
        noDataState: Alerting
        execErrState: Error
        annotations:
          summary: A RabbitMQ queue (payments, orders or fulfilment) has no consumer, so its events are not being processed.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: min(rabbitmq_detailed_queue_consumers{queue=~"hook[.].*"})
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }

      - uid: hook-backlog
        title: Events piling up
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: More than 100 events are waiting in a RabbitMQ queue; a consumer is stuck or too slow.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: max(rabbitmq_detailed_queue_messages_ready{queue=~"hook[.].*"})
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [100] }

      - uid: hook-5xx
        title: Server errors
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: More than 20 requests failed with a 5xx error in the last 5 minutes.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: loki
            model:
              refId: A
              queryType: instant
              expr: sum(count_over_time({service="nginx"} |~ `" 5[0-9][0-9] ` [5m]))
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [20] }

      - uid: hook-dead-letter
        title: Background job failed permanently
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: An outbox event was dead-lettered after 5 attempts and needs a person to look at it (admin dead-letter replay).
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: loki
            model:
              refId: A
              queryType: instant
              expr: sum(count_over_time({project="hook"} |= "dead-lettered" [10m]))
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }

      - uid: hook-slow
        title: API slow
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: 95% of API requests are taking longer than 0.8 seconds.
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{route!="/metrics"}[5m])))
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.8] }

      - uid: hook-outbox-stuck
        title: Outbox stuck
        condition: C
        for: 2m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: An outbox event has been waiting more than 60 seconds; the worker or RabbitMQ may be down.
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: max(outbox_oldest_pending_seconds)
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [60] }

      - uid: hook-restarts
        title: API restarting
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: An API copy restarted more than twice in 10 minutes.
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: max(changes(process_start_time_seconds{job="api"}[10m]))
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [2] }
