<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      {{emailStyles}}
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <div class="brand">hook<span class="brand-dot">.</span></div>
        <div class="icon">↗</div>
        <h1>New marketplace order</h1>
        <p class="lead">
          {{customerName}} placed a new order. Review payment, vendor readiness,
          and dispatch progress from admin.
        </p>
        <div class="panel">
          <div class="row">
            <span class="label">Order ID</span
            ><span class="value">{{orderCode}}</span>
          </div>
          <div class="row">
            <span class="label">Items</span
            ><span class="value">{{itemCount}}</span>
          </div>
          <div class="row">
            <span class="label">GMV</span><span class="value">{{amount}}</span>
          </div>
        </div>
        <p style="text-align: center">
          <a class="button" href="{{dashboardUrl}}">Open admin</a>
        </p>
      </div>
      <p class="footer">Hook internal notification.</p>
    </div>
  </body>
</html>
