<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>{{emailStyles}}</style></head><body><div class="wrap"><div class="card"><div class="banner"><div class="brand">hook<span class="brand-dot">.</span></div><p class="greeting">Hello {{name}}</p><h1>Payment confirmed</h1></div><div class="body"><p class="lead">We&#39;ve confirmed payment for order {{orderCode}}. Your order is now moving into fulfilment.</p><div class="panel"><div class="row"><span class="label">Order ID</span><span class="value">{{orderCode}}</span></div><div class="row row-total"><span class="label">Amount paid</span><span class="value">{{amount}}</span></div></div><p style="text-align:center"><a class="button" href="{{appUrl}}">Track your order</a></p></div></div><p class="footer"><span class="footer-brand">hook<span>.</span></span><br>Thanks for shopping with Hook.<br>Need help? Contact {{supportEmail}}</p></div></body></html>
