<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>{{emailStyles}}</style></head><body><div class="wrap"><div class="card"><div class="brand">hook<span class="brand-dot">.</span></div><div class="icon">₦</div><h1>You have a new counter-offer</h1><p class="lead">Hi {{name}}, Hook sent you a counter-offer for {{productTitle}}. Respond before it expires.</p><div class="panel"><div class="row"><span class="label">Product</span><span class="value">{{productTitle}}</span></div><div class="row"><span class="label">Counter-offer</span><span class="value">{{counterPrice}}</span></div><div class="row"><span class="label">Expires</span><span class="value">{{expiresAt}}</span></div></div><p style="text-align:center"><a class="button" href="{{appUrl}}">Respond now</a></p></div><p class="footer">Need help? Contact {{supportEmail}}</p></div></body></html>
