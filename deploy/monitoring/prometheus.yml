global:
  scrape_interval: 30s

scrape_configs:
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
  - job_name: rabbitmq
    metrics_path: /metrics/detailed
    params:
      family: [queue_consumer_count, queue_coarse_metrics]
    static_configs:
      - targets: ["rabbitmq:15692"]
